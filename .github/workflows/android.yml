# ================================================================
#  ANDROID-APP BAUEN                                    (29.09.2026)
# ----------------------------------------------------------------
#  Dietmar: "kannst du eine apk erstellen?" - Auf die Rueckfrage: GitHub
#  soll sie bauen, und die App soll zum allein Lernen UND als Server fuer
#  andere im WLAN taugen.
#
#  Laeuft bei jedem Hochladen (und von Hand unter "Actions"). Ergebnis:
#  "Amateurfunk-Trainer.apk" unter Releases -> "Android-App (Test)".
#  Diese Test-Version ist als Vorabversion markiert - der Updater des
#  Trainers sieht sie nicht (er fragt nur nach releases/latest).
#
#  Schluessel: Liegt bei GitHub unter Settings -> Secrets ein eigener
#  (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS,
#  ANDROID_KEY_PASS), wird er benutzt. Sonst der Test-Schluessel aus
#  android/app/trainer-test.jks.
#
#  RAUS AUS DER TESTPHASE                               (01.10.2026)
#  Dietmar: "Ich moechte aus der Testphase raus und moechte die App
#  dann auch zu meinen anderen Apps fuer Windows, Mac und Linux
#  hinzufuegen." Auf die Rueckfragen: eigener Schluessel, erst GitHub
#  und die Projektseite (noch kein Store).
#    - Wird ein Release veroeffentlicht (Release-Hochladen.bat), baut
#      dieser Auftrag die App aus genau diesem Stand und haengt sie als
#      "Amateurfunk-Trainer-<Fassung>-android.apk" daneben - neben das
#      Windows-ZIP, .deb, .rpm und das Mac-ZIP. Dazu ein Absatz
#      "Android" in der Beschreibung, falls er noch fehlt.
#    - Von Hand unter "Actions" mit einem Tag (z. B. v1.298.0) haengt er
#      sie an ein schon vorhandenes Release. Das macht auch
#      Release-Hochladen.bat, wenn dort die APK fehlt.
#    - Jedes Hochladen baut weiter die Vorabversion zum Ausprobieren
#      (Releases -> "Android-App (Vorabversion)", Tag android-test).
#    - Der eigene Schluessel kommt von _Android-Schluessel.bat (bleibt auf
#      Dietmars Rechner). Noetig sind nur ANDROID_KEYSTORE_BASE64 und
#      ANDROID_KEYSTORE_PASS; den Namen im Schluessel (Alias) liest der
#      Auftrag selbst aus, das Schluesselpasswort ist dasselbe. Ein
#      Release ohne eigenen Schluessel gibt es nicht - dann bricht der
#      Bau mit einem Hinweis ab, statt still den Test-Schluessel zu nehmen.
#
#  PLAY STORE                                           (05.10.2026)
#  Dietmar: "danach moechte ich in den Google Play Store" - "Bereite es
#  so weit vor".
#    - Mit eigenem Schluessel baut der Auftrag zusaetzlich das Paket fuer
#      den Play Store (.aab, TRAINER_PLAY=1: ohne Datei-Updater von
#      GitHub). Es haengt NICHT am Release, sondern liegt unter Actions
#      beim jeweiligen Lauf als "Play-Store-AAB" zum Herunterladen.
#    - Google verlangt 16-KB-Seiten (ab Android 15). Node.js fuer Android
#      gibt es fertig nur mit 4 KB - deshalb baut libnode16k.yml es
#      einmal selbst und legt es unter Releases -> libnode-16k ab. Liegt
#      es dort, nimmt dieser Auftrag es. Die Pruefung am Ende sagt fuer
#      jede Programmdatei, ob sie passt.
#    - cloudflared (Internet-Link) kommt nur ins Play-Paket, wenn es die
#      16-KB-Pruefung besteht - sonst fehlt dort eben der Knopf dafuer.
# ================================================================
name: Android-App bauen

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'An welches Release soll die App? (z. B. v1.298.0) - leer: nur die Vorabversion'
        required: false
        default: ''

permissions:
  contents: write

# Vorabversionen loesen einander ab (ein neueres Hochladen bricht den
# laufenden Bau ab). Ein Bau fuer ein Release wird nie abgebrochen -
# sonst stuende das Release ohne App da.
concurrency:
  group: android-app-${{ github.event_name == 'push' && 'vorschau' || github.run_id }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ziel bestimmen (Release oder Vorabversion)
        id: ziel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EINGABE_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$EINGABE_TAG}"
          TAG="$(printf '%s' "$TAG" | tr -d '[:space:]')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then echo "Ziel: Release $TAG"; else echo "Ziel: Vorabversion (android-test)"; fi

      - uses: actions/checkout@v4
        with:
          # Fuer ein Release genau dessen Stand, sonst wie bisher
          ref: ${{ steps.ziel.outputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Node.js fuer Android holen (nodejs-mobile 18.20.4)
        run: |
          set -e
          mkdir -p /tmp/nm && cd /tmp/nm
          npm pack nodejs-mobile-react-native@18.20.4 --silent
          tar xzf nodejs-mobile-react-native-18.20.4.tgz package/android/libnode package/LICENSE
          mkdir -p "$GITHUB_WORKSPACE/android/app/libnode"
          cp -r package/android/libnode/* "$GITHUB_WORKSPACE/android/app/libnode/"
          rm -rf "$GITHUB_WORKSPACE/android/app/libnode/bin/x86_64"
          ls -la "$GITHUB_WORKSPACE/android/app/libnode/bin/"*

      - name: Node.js mit 16-KB-Seiten einsetzen (falls schon gebaut)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release download libnode-16k -p 'libnode-16k.zip' -D /tmp/l16 2>/dev/null; then
            unzip -o -q /tmp/l16/libnode-16k.zip -d /tmp/l16/x
            for abi in arm64-v8a armeabi-v7a; do
              if [ -f "/tmp/l16/x/$abi/libnode.so" ]; then
                cp "/tmp/l16/x/$abi/libnode.so" "android/app/libnode/bin/$abi/libnode.so"
                echo "16-KB-Node.js fuer $abi eingesetzt"
              fi
            done
          else
            echo "::warning::Noch kein Node.js mit 16-KB-Seiten (Releases -> libnode-16k). Fuer GitHub egal, fuer den Play Store noetig: unter Actions 'Node.js fuer Android mit 16-KB-Seiten bauen' einmal starten."
          fi

      - name: Trainer einpacken
        run: |
          set -e
          ZIEL=/tmp/trainer
          rm -rf "$ZIEL" && mkdir -p "$ZIEL"
          rsync -a ./ "$ZIEL/" \
            --exclude '.git' --exclude '.github' --exclude 'android' --exclude 'docs' \
            --exclude 'node' --exclude 'node_modules' --exclude 'piper' --exclude 'kokoro' \
            --exclude 'release' --exclude 'data' --exclude 'backup' --exclude 'Hoerbuch' \
            --exclude 'tts_cache' --exclude 'lerncoach' --exclude 'kurse' --exclude '_*' \
            --exclude '*.bat' --exclude '*.vbs' --exclude '*.exe' --exclude '*.iss' \
            --exclude '*.sh' --exclude '*.ps1' --exclude '*.py'
          cp /tmp/nm/package/LICENSE "$ZIEL/LIZENZ-nodejs-mobile.txt"
          cd "$ZIEL"
          npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/assets"
          zip -qr -9 "$GITHUB_WORKSPACE/android/app/src/main/assets/trainer.zip" .
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/assets"

      - name: Versionsnummer
        run: |
          echo "TRAINER_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "TRAINER_VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Eigenen Schluessel benutzen (falls hinterlegt)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          TAG: ${{ steps.ziel.outputs.tag }}
        run: |
          if [ -n "$KS" ]; then
            # Zeilenumbrueche oder Leerzeichen aus dem Kopieren stoeren nicht
            printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > /tmp/eigen.keystore
            # Der Name im Schluessel: aus dem Secret, sonst aus der Datei
            # (Windows vergibt ihn beim Ablegen selbst).
            if [ -z "$K_ALIAS" ]; then
              K_ALIAS="$(keytool -list -v -keystore /tmp/eigen.keystore -storepass "$KS_PASS" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
            fi
            if [ -z "$K_ALIAS" ]; then
              echo "::error::Der eigene Schluessel laesst sich nicht oeffnen. Stimmen ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASS? (_Android-Schluessel.bat legt beide noch einmal in die Zwischenablage.)"
              exit 1
            fi
            echo "TRAINER_KEYSTORE=/tmp/eigen.keystore" >> "$GITHUB_ENV"
            echo "TRAINER_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "TRAINER_KEY_ALIAS=$K_ALIAS" >> "$GITHUB_ENV"
            echo "TRAINER_KEY_PASS=${K_PASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "Eigener Schluessel wird benutzt."
          elif [ -n "$TAG" ]; then
            echo "::error::Fuer ein Release braucht die App den eigenen Schluessel: _Android-Schluessel.bat starten und ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASS bei GitHub eintragen. Danach unter Actions mit dem Tag $TAG noch einmal starten."
            exit 1
          else
            echo "Test-Schluessel (android/app/trainer-test.jks) wird benutzt."
          fi

      - name: APK bauen
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: APK bereitlegen
        id: apk
        env:
          TAG: ${{ steps.ziel.outputs.tag }}
        run: |
          # Am Release heisst sie wie die anderen Dateien dort:
          # Amateurfunk-Trainer-1.298.0-android.apk
          if [ -n "$TAG" ]; then NAME="Amateurfunk-Trainer-${TAG#v}-android.apk"; else NAME="Amateurfunk-Trainer.apk"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Amateurfunk-Trainer-APK
          path: ${{ steps.apk.outputs.name }}

      # ---------------- Play Store (05.10.2026) ----------------
      - name: cloudflared fuer den Play Store pruefen
        if: env.TRAINER_KEYSTORE != ''
        run: |
          CF=android/app/libnode/bin/arm64-v8a/libcloudflared.so
          if [ -f "$CF" ] && readelf -lW "$CF" | awk '/LOAD/{print $NF}' | grep -qv '0x4000\|0x10000'; then
            echo "cloudflared hat keine 16-KB-Seiten - im Play-Paket ohne Internet-Link."
            echo "TRAINER_OHNE_TUNNEL=1" >> "$GITHUB_ENV"
          fi

      - name: Play-Store-Paket bauen (.aab)
        if: env.TRAINER_KEYSTORE != ''
        working-directory: android
        env:
          TRAINER_PLAY: '1'
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: 16-KB-Pruefung (Play Store)
        if: env.TRAINER_KEYSTORE != ''
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          rm -rf /tmp/aab && mkdir -p /tmp/aab && unzip -q "$AAB" 'base/lib/*' -d /tmp/aab || true
          FEHLT=0
          echo "| Datei | Seiten |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/aab/base/lib/arm64-v8a/*.so; do
            [ -f "$f" ] || continue
            A=$(readelf -lW "$f" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
            if echo "$A" | grep -q '0x1000 \|0x2000 \|0x800 '; then
              echo "| $(basename $f) | NUR 4 KB ($A) |" >> "$GITHUB_STEP_SUMMARY"; FEHLT=1
            else
              echo "| $(basename $f) | ok ($A) |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "$(basename $f): $A"
          done
          if [ "$FEHLT" = 1 ]; then
            echo "::warning::Das Play-Paket hat noch Programmdateien mit 4-KB-Seiten - Google nimmt es so nicht an. Siehe Zusammenfassung."
          else
            echo "Alle Programmdateien haben 16-KB-Seiten - bereit fuer den Play Store."
          fi
          N="Amateurfunk-Trainer-${TRAINER_VERSION_NAME}-play.aab"
          cp "$AAB" "$N"
          echo "AAB_NAME=$N" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: env.TRAINER_KEYSTORE != ''
        with:
          name: Play-Store-AAB
          path: ${{ env.AAB_NAME }}
          retention-days: 90

      - name: An das Release haengen
        if: steps.ziel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ziel.outputs.tag }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release upload "$TAG" "$NAME" --clobber
          # Ein Absatz "Android" in der Beschreibung - nur, wenn er fehlt
          # (Release-Hochladen.bat schreibt ihn selbst, sobald die APK dranhaengt).
          gh release view "$TAG" --json body -q .body > /tmp/text.md
          if ! grep -q '^\*\*Android\*\*' /tmp/text.md; then
            python3 - "$NAME" <<'PY'
          import sys
          name = sys.argv[1]
          text = open('/tmp/text.md', encoding='utf-8').read()
          absatz = ('**Android** \u2014 `' + name + '` am Handy laden und \u00f6ffnen, ab Android 8. '
                    'Android fragt beim ersten Mal, ob Apps aus dieser Quelle erlaubt sind. '
                    'Ein Update wird einfach dar\u00fcber installiert, der Lernstand bleibt.\n\n')
          marke = 'Der Lernstand bleibt beim Update erhalten'
          if marke in text:
              text = text.replace(marke, absatz + marke, 1)
          elif text.startswith('## Installation'):
              text = text.replace('## Installation\n\n', '## Installation\n\n' + absatz, 1)
          else:
              text = absatz + text
          open('/tmp/neu.md', 'w', encoding='utf-8').write(text)
          PY
            gh release edit "$TAG" --notes-file /tmp/neu.md
          fi

      - name: Als Vorabversion unter Releases ablegen
        if: steps.ziel.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTIZ="Vorabversion der Android-App des Amateurfunk-Trainers (ab Android 8), bei jedem Hochladen neu gebaut – zum Ausprobieren. Die fertige App liegt beim aktuellen Release neben Windows, Linux und macOS. Die Datei Amateurfunk-Trainer.apk auf dem Handy öffnen und installieren – Android fragt dabei, ob Apps aus dieser Quelle erlaubt sind."
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test --prerelease --title "Android-App (Vorabversion)" --notes "$NOTIZ"
          else
            gh release edit android-test --prerelease --title "Android-App (Vorabversion)" --notes "$NOTIZ"
          fi
          gh release upload android-test Amateurfunk-Trainer.apk --clobber
