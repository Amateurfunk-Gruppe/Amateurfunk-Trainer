<!doctype html>
<!-- Funki im Startbild der App (01.10.2026). Dietmar: "Die Antenne raus und
     ein animierter Funki rein" - "Schoen waere es auch, wenn er animiert
     waere und winkt." Dieselbe Zeichnung wie in der App (maskottchen() in
     Index.html); gezeigt von StartFunki.java in einem kleinen,
     durchsichtigen Browserfenster ueber dem dunklen Startbild. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
svg{width:76%;height:auto;overflow:visible;animation:rein .8s cubic-bezier(.3,1.5,.5,1) both;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.mk-huepf{animation:wippen 2.6s ease-in-out .8s infinite}
.mk-antenne{transform-origin:80px 36px;animation:antenne 1.9s ease-in-out infinite}
.mk-auge{transform-origin:0 58.5px;transform-box:view-box;animation:blinzeln 4.2s 1.2s infinite}
.mk-arm-l{transform-origin:12px 86px;transform:rotate(28deg)}
.mk-arm-r{transform-origin:100px 86px;transform:rotate(-140deg);animation:winken .6s ease-in-out .5s infinite alternate}
.mk-w1{animation:welle 1.6s ease-in-out infinite}
.mk-w2{animation:welle 1.6s ease-in-out .8s infinite}
@keyframes rein{from{transform:translateY(40px) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes wippen{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes antenne{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes blinzeln{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes winken{from{transform:rotate(-122deg)}to{transform:rotate(-160deg)}}
@keyframes welle{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
