// Amateurfunk-Trainer als Android-App (29.09.2026).
// Dietmar: "kannst du eine apk erstellen?" - Weg: GitHub baut sie,
// gedacht zum allein Lernen UND als Server fuer andere im WLAN.
//
// Drinnen steckt Node.js fuer Android (nodejs-mobile, MIT-Lizenz). Die
// App packt beim ersten Start den Trainer aus (assets/trainer.zip) und
// startet Server.js darin - genau wie am PC. Die Oberflaeche ist die
// gewohnte Index.html in einem Browserfenster der App.
//
// libnode/ und assets/trainer.zip legt der Bauauftrag bei GitHub an
// (.github/workflows/android.yml); sie liegen nicht im Repository.
plugins {
    id 'com.android.application'
}

// Versionsnummer wie am PC: die oberste im CHANGELOG.md (29.09.2026 -
// vorher stand 1.297.0 aus package.json in der App, gemeint war 1.298.0).
def trainerVersion = { ->
    def f = rootProject.file('../CHANGELOG.md')
    if (f.exists()) {
        def m = (f.getText('UTF-8') =~ /(?m)^## \[(\d+\.\d+\.\d+)\]/)
        if (m.find()) return m.group(1)
    }
    return System.getenv('TRAINER_VERSION_NAME') ?: '1.0'
}

android {
    namespace 'com.amateurfunktrainer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amateurfunktrainer.app'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('TRAINER_VERSION_CODE') ?: '1')
        versionName trainerVersion()
        ndk {
            // Handys: 64 Bit (fast alle seit etwa 2017) und 32 Bit (aeltere).
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }

    signingConfigs {
        trainer {
            // Test-Schluessel (siehe .github/workflows/android.yml). Solange
            // derselbe Schluessel benutzt wird, laesst sich eine neue APK
            // ueber die alte installieren - ohne dass Lernstaende verloren gehen.
            storeFile file(System.getenv('TRAINER_KEYSTORE') ?: 'trainer-test.jks')
            storePassword System.getenv('TRAINER_KEYSTORE_PASS') ?: 'amateurfunk'
            keyAlias System.getenv('TRAINER_KEY_ALIAS') ?: 'trainer'
            keyPassword System.getenv('TRAINER_KEY_PASS') ?: 'amateurfunk'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig signingConfigs.trainer
        }
    }

    sourceSets {
        main.jniLibs.srcDirs = ['libnode/bin']
    }

    packaging {
        jniLibs {
            // libnode.so kommt sowohl ueber CMake als auch ueber jniLibs.
            pickFirsts += ['**/libnode.so', '**/libc++_shared.so']
            // Gepackt statt entpackt: die APK wird deutlich kleiner.
            // Ausserdem legt Android die Programmteile dann als echte Dateien
            // ab - noetig, damit cloudflared ausgefuehrt werden darf.
            useLegacyPackaging = true
            // cloudflared ist ein fertiges Go-Programm - nicht anfassen.
            keepDebugSymbols += ['**/libcloudflared.so']
        }
    }

    androidResources {
        // Nicht auslassen, was mit Punkt oder Unterstrich beginnt.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress 'zip'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

// ----------------------------------------------------------------
// Internet-Link auch am Handy (29.09.2026, Versuch).
// Dietmar: "Gruppenraum Link erzeugen geht leider nicht." - "versuche das mal"
//
// Am PC baut cloudflared den Link ins Internet. Das normale Linux-Programm
// von Cloudflare findet unter Android keinen Namensdienst (DNS). Termux
// baut cloudflared eigens fuer Android - das holen wir hier beim Bauen
// (nur bei GitHub, Variable CI) und legen es als libcloudflared.so zu den
// Programmteilen der App. Nur von dort darf Android es starten.
// Klappt das Holen nicht, wird die App trotzdem gebaut - dann eben ohne
// Internet-Link (der Knopf dafuer bleibt in der App verborgen).
// cloudflared: Apache-2.0-Lizenz, Cloudflare Inc.
// ----------------------------------------------------------------
def tunnelHolen = tasks.register('tunnelHolen') {
    onlyIf { System.getenv('CI') != null }
    doLast {
        def quellen = ['https://packages-cf.termux.dev/apt/termux-main',
                       'https://packages.termux.dev/apt/termux-main',
                       'https://grimler.se/termux/termux-main']
        def abis = ['arm64-v8a': 'aarch64', 'armeabi-v7a': 'arm']
        abis.each { abi, arch ->
            def ziel = file("libnode/bin/${abi}/libcloudflared.so")
            if (ziel.exists()) return
            def geschafft = false
            for (basis in quellen) {
                if (geschafft) break
                try {
                    def index = null
                    try {
                        index = new URL("${basis}/dists/stable/main/binary-${arch}/Packages").getText('UTF-8')
                    } catch (Exception e1) {
                        def gz = new java.util.zip.GZIPInputStream(new URL("${basis}/dists/stable/main/binary-${arch}/Packages.gz").openStream())
                        index = gz.getText('UTF-8')
                    }
                    def block = index.replace('\r', '').split('\n\n').find { it.startsWith('Package: cloudflared\n') }
                    if (block == null) throw new Exception('cloudflared nicht im Paketverzeichnis')
                    def pfad = (block =~ /(?m)^Filename: (.+)$/)[0][1].trim()
                    def abh = (block =~ /(?m)^Depends: (.+)$/)
                    println "cloudflared fuer ${abi}: ${pfad}" + (abh.find() ? " (Depends: ${abh.group(1)})" : '')
                    def tmp = file("${buildDir}/tunnel/${arch}")
                    tmp.deleteDir()
                    tmp.mkdirs()
                    def deb = new File(tmp, 'cf.deb')
                    deb.bytes = new URL("${basis}/${pfad}").bytes
                    def pb = new ProcessBuilder('bash', '-c', 'ar x cf.deb && mkdir -p inhalt && tar -xf data.tar.* -C inhalt')
                    pb.directory(tmp)
                    pb.redirectErrorStream(true)
                    def proc = pb.start()
                    def ausgabe = proc.inputStream.getText('UTF-8')
                    if (proc.waitFor() != 0) throw new Exception('Auspacken fehlgeschlagen: ' + ausgabe)
                    def bin = new File(tmp, 'inhalt/data/data/com.termux/files/usr/bin/cloudflared')
                    if (!bin.exists()) throw new Exception('cloudflared nicht im Paket gefunden')
                    ziel.parentFile.mkdirs()
                    ziel.bytes = bin.bytes
                    println "cloudflared fuer ${abi} eingebaut (${(long) (ziel.length() / 1024)} KB)"
                    geschafft = true
                } catch (Exception e) {
                    println "WARNUNG: cloudflared fuer ${abi} von ${basis} nicht geholt: ${e.message}"
                }
            }
        }
    }
}
tasks.named('preBuild') { dependsOn tunnelHolen }
